[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-rag-v2"
version = "0.1.0"
description = "Lokale Import-Pipeline für Retro-RAG V2"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
