# Vorlage: vor bestehenden allgemeinen trust/scram-Regeln in pg_hba.conf einfügen.
# NICHT ungeprüft ausführen. Nur die sieben V2-Loginidentitäten betreffen.
# Bestehende V1- und Nextcloud-Regeln bleiben unverändert.
# Reihenfolge ist entscheidend: erste passende Regel gewinnt.
# Zunächst Zugang ausschließlich über TCP-Loopback IM CONTAINER erlauben.
# Für V2-Dienste in anderen Docker-Containern nach separatem Netzwerkcheck
# eine spezifische host-Zeile mit dem tatsächlichen Docker-CIDR ergänzen.
#
# Keine lokale Trust-Authentifizierung für diese V2-Logins:
local   all                          rag_v2_importer_login,rag_v2_reviewer_login,rag_v2_inventory_login,rag_v2_reader_login,rag_v2_lifecycle_login,rag_v2_query_logger_login,rag_v2_migrator_login    reject
# Zulässige V2-Datenbanken mit Passwort (vor globaler localhost-trust-Zeile):
host    retro_rag_v2,retro_rag_v2_test rag_v2_importer_login,rag_v2_reviewer_login,rag_v2_inventory_login,rag_v2_reader_login,rag_v2_lifecycle_login,rag_v2_query_logger_login,rag_v2_migrator_login 127.0.0.1/32 scram-sha-256
host    retro_rag_v2,retro_rag_v2_test rag_v2_importer_login,rag_v2_reviewer_login,rag_v2_inventory_login,rag_v2_reader_login,rag_v2_lifecycle_login,rag_v2_query_logger_login,rag_v2_migrator_login ::1/128      scram-sha-256
# Verbindungen zu jeder anderen Datenbank einschließlich V1 ablehnen:
host    all                          rag_v2_importer_login,rag_v2_reviewer_login,rag_v2_inventory_login,rag_v2_reader_login,rag_v2_lifecycle_login,rag_v2_query_logger_login,rag_v2_migrator_login 0.0.0.0/0   reject
host    all                          rag_v2_importer_login,rag_v2_reviewer_login,rag_v2_inventory_login,rag_v2_reader_login,rag_v2_lifecycle_login,rag_v2_query_logger_login,rag_v2_migrator_login ::/0        reject
